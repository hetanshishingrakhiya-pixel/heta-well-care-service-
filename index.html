function startWatch(site){if(WID!=null){navigator.geolocation.clearWatch(WID);WID=null}if(!navigator.geolocation)return;
 WID=navigator.geolocation.watchPosition(p=>{const d=dist(p.coords.latitude,p.coords.longitude,site.lat,site.lng),lim=site.radius+Math.min(Math.round(p.coords.accuracy||0),100),w=$("wst");

function showQR(id){const url=location.origin+location.pathname+"?site="+id,e=$("qrc");e.style.display="block";e.innerHTML=`<h3>${SMAP[id].name}</h3><div id="qrbox" style="display:flex;justify-content:center;padding:8px"></div><p class="mu" style="text-align:center">કામદાર ફોનના કેમેરાથી આ QR સ્કેન કરે, લિંક ખૂલે એટલે સેલ્ફી લઈ હાજરી પૂરે. સ્ક્રીનશોટ લઈ પ્રિન્ટ કરી શકાય.</p><button class="a" onclick="window.print()">🖨 પ્રિન્ટ</button>`;new QRCode($("qrbox"),{text:url,width:220,height:220});e.scrollIntoView()}
function userCard(){const ad=U.role!="supervisor",mine=TEAM.filter(x=>x.role==(ad?"supervisor":"employee"));return`<div class="card" id="uc"><h3>${ad?"નવો સુપરવાઇઝર":"નવો કામદાર"}</h3><input id="un" placeholder="નામ"><input id="um" type="tel" placeholder="મોબાઇલ"><input id="up" type="password" placeholder="PIN (6 આંકડા)">${ad?"":'<input id="uw" type="number" placeholder="રોજનો પગાર ₹"><label class="mu">પદ / પ્રકાર</label><select id="ut">${DESL.map(d=>`<option>${d}</option>`).join("")}</select><input id="uo" placeholder="અન્ય પદ હોય તો નામ લખો">'}<button class="a" onclick="addU()">ઉમેરો</button><div>${mine.length?mine.map(x=>`<div class="row"><span>${x.name}<br><span class="mu">${x.mobile}${x.role=="employee"?" | ₹"+(x.wage||0)+(x.des?" | "+x.des:""):""}</span></span><span>${x.role=="employee"?`${desSel(x)}<button class="s" onclick="expCert('${x.id}')">પ્રમાણપત્ર</button>`:""}<button class="s" onclick="resetPin('${x.id}')">PIN</button><button class="s r" onclick="delU('${x.id}')">કાઢો</button></span></div>`).join(""):'<p class="mu">હજી કોઈ નથી.</p>'}</div></div>`}
async function addU(){const n=$("un").value.trim(),m=$("um").value.trim(),p=$("up").value,w=$("uw")?+$("uw").value:0,r=U.role!="supervisor"?"supervisor":"employee";if(!n||!m||p.length<6){alert("નામ, મોબાઇલ અને 6 આંકડાનો PIN જરૂરી");return}
 try{let x;try{x=await sec.auth().createUserWithEmailAndPassword(em(m),p)}catch(e){if(e.code=="auth/email-already-in-use")x=await sec.auth().signInWithEmailAndPassword(em(m),p);else throw e}
  await db.collection("users").doc(x.user.uid).set(r=="employee"?{name:n,mobile:m,role:r,cid:CID,wage:w,sup:U.id,des:$("ut")?($("ut").value=="અન્ય"?($("uo").value.trim()||"અન્ય"):$("ut").value):"",drv:!!($("ut")&&$("ut").value=="ડ્રાઇવર")}:{name:n,mobile:m,role:r,cid:CID,wage:w});await sec.auth().signOut();alert("ઉમેર્યો ✓");supUI()}catch(e){alert(e.code=="auth/invalid-credential"?"આ નંબરનું ખાતું પહેલેથી છે. અગાઉ વાપરેલો PIN જ નાખો.":e.message)}}
async function delU(id){if(!confirm("આને કાઢવા છે? તે લોગિન કરી શકશે નહીં."))return;try{await db.collection("users").doc(id).delete();supUI()}catch(e){alert(e.message)}}
async function payroll(){const mo=$("mo").value,s=await db.collection("attendance").where("cid","==",CID).where("sup","==",U.id).get(),G={};
 s.docs.map(d=>d.data()).filter(a=>a.date.startsWith(mo)&&a.out&&a.ap=="ok").forEach(a=>{const c=calc(a.w,a.hrs,a.otSt=="ok"),K=a.name+"|"+(a.sup||""),g=G[K]||(G[K]={n:a.name,p:a.des||"",d:0,h:0,o:0,g:0,pf:0,es:0,net:0});g.d++;g.h+=a.hrs;g.o+=c.o;g.g+=c.g;g.pf+=c.pf;g.es+=c.es;g.net+=c.net});
 const R=Object.values(G);window._csv="Name,Designation,Days,Hours,OT,Gross,EPF,ESIC,Net\n"+R.map(g=>[g.n,g.p,g.d,g.h.toFixed(1),g.o.toFixed(1),g.g,g.pf,g.es,g.net].join(",")).join("\n");
 $("pr").innerHTML=`<div class="sc"><table><tr><th>નામ</th><th>પદ</th><th>દિવસ</th><th>કલાક</th><th>OT</th><th>કુલ</th><th>EPF</th><th>ESIC</th><th>ચોખ્ખું</th></tr>${R.map(g=>`<tr><td>${g.n}</td><td>${g.p}</td><td>${g.d}</td><td>${g.h.toFixed(1)}</td><td>${g.o.toFixed(1)}</td><td>${g.g}</td><td>${g.pf}</td><td>${g.es}</td><td><b>${g.net}</b></td></tr>`).join("")}</table></div><button class="a" onclick="dl()">⬇ Excel (CSV) ડાઉનલોડ</button>`}
function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+window._csv],{type:"text/csv"}));a.download="payroll.csv";a.click()}
</script></body></html>
