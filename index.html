 unsub.push(db.collection("checks").where("cid","==",CID).onSnapshot(s=>{const e=$("cl");if(!e)return;const L=s.docs.map(d=>d.data()).filter(c=>TEAM.some(x=>x.id==c.uid)).sort((a,b)=>b.t-a.t).slice(0,10);const nm=u=>(TEAM.find(x=>x.id==u)||{}).name||"?";e.innerHTML=L.map(c=>{let t;const old=Date.now()-c.t>200000;if(c.st=="ok")t='<span class="ok">પાસ ✓</span>';else if(c.st=="miss"||(c.st=="ring"&&old&&c.dv))t='<span class="bad">ચૂકી ગયો ⚠ (ફ્લેગ)</span>';else if(c.st=="ring"&&old&&!c.dv)t="ટેકનિકલ સમસ્યા (ફોન સુધી પહોંચ્યું નથી)";else t="રિંગ ચાલુ...";return`<div class="row"><span>${nm(c.uid)} ${tf(c.t)}</span><span>${t}</span></div>`}).join("")+'<p class="mu">ચૂકી જાય તો સજા નહીં, ફક્ત ફ્લેગ. નિર્ણય માણસ લે.</p>'}));

let PEND=[];const apOne=(id,v)=>db.collection("attendance").doc(id).update({ap:v});
async function apAll(){if(!confirm("બધી બાકી હાજરી મંજૂર કરવી છે?"))return;const b=db.batch();PEND.forEach(id=>b.update(db.collection("attendance").doc(id),{ap:"ok"}));await b.commit()}
const otd=(id,v)=>db.collection("attendance").doc(id).update({otSt:v});
const sendChk=()=>{const u=$("ce").value;if(u)db.collection("checks").add({cid:CID,uid:u,t:Date.now(),st:"ring",dv:false})};
let SMAP={};
async function addSite(){const n=$("sn").value.trim(),r=+$("sr").value||100;if(!n){alert("સાઇટનું નામ લખો");return}
 try{const p=await pos();await db.collection("sites").add({cid:CID,sup:U.id,name:n,lat:p.latitude,lng:p.longitude,radius:r,by:U.name,st:"ok",acc:Math.round(p.accuracy||0)});alert("સાઇટ ઉમેરાઈ ✓")}catch(e){alert("લોકેશન ન મળ્યું: "+e.message)}}
const siteSt=(id,v)=>db.collection("sites").doc(id).update({st:v});
const delSite=id=>{if(confirm("આ સાઇટ કાઢવી છે?"))db.collection("sites").doc(id).delete()};
function showQR(id){const url=location.origin+location.pathname+"?site="+id,e=$("qrc");e.style.display="block";e.innerHTML=`<h3>${SMAP[id].name}</h3><div id="qrbox" style="display:flex;justify-content:center;padding:8px"></div><p class="mu" style="text-align:center">કામદાર ફોનના કેમેરાથી આ QR સ્કેન કરે, લિંક ખૂલે એટલે સેલ્ફી લઈ હાજરી પૂરે. સ્ક્રીનશોટ લઈ પ્રિન્ટ કરી શકાય.</p><button class="a" onclick="window.print()">🖨 પ્રિન્ટ</button>`;new QRCode($("qrbox"),{text:url,width:220,height:220});e.scrollIntoView()}
function userCard(){const ad=U.role=="admin",mine=TEAM.filter(x=>x.role==(ad?"supervisor":"employee"));return`<div class="card" id="uc"><h3>${ad?"નવો સુપરવાઇઝર":"નવો કામદાર"}</h3><input id="un" placeholder="નામ"><input id="um" type="tel" placeholder="મોબાઇલ"><input id="up" type="password" placeholder="PIN (6 આંકડા)">${ad?"":'<input id="uw" type="number" placeholder="રોજનો પગાર ₹">'}<button class="a" onclick="addU()">ઉમેરો</button><div>${mine.length?mine.map(x=>`<div class="row"><span>${x.name}<br><span class="mu">${x.mobile}${x.role=="employee"?" | ₹"+(x.wage||0):""}</span></span><button class="s r" onclick="delU('${x.id}')">કાઢો</button></div>`).join(""):'<p class="mu">હજી કોઈ નથી.</p>'}</div></div>`}
async function addU(){const n=$("un").value.trim(),m=$("um").value.trim(),p=$("up").value,w=$("uw")?+$("uw").value:0,r=U.role=="admin"?"supervisor":"employee";if(!n||!m||p.length<6){alert("નામ, મોબાઇલ અને 6 આંકડાનો PIN જરૂરી");return}
 try{let x;try{x=await sec.auth().createUserWithEmailAndPassword(em(m),p)}catch(e){if(e.code=="auth/email-already-in-use")x=await sec.auth().signInWithEmailAndPassword(em(m),p);else throw e}
  await db.collection("users").doc(x.user.uid).set(r=="employee"?{name:n,mobile:m,role:r,cid:CID,wage:w,sup:U.id}:{name:n,mobile:m,role:r,cid:CID,wage:w});await sec.auth().signOut();alert("ઉમેર્યો ✓");supUI()}catch(e){alert(e.code=="auth/invalid-credential"?"આ નંબરનું ખાતું પહેલેથી છે. અગાઉ વાપરેલો PIN જ નાખો.":e.message)}}
async function delU(id){if(!confirm("આને કાઢવા છે? તે લોગિન કરી શકશે નહીં."))return;try{await db.collection("users").doc(id).delete();supUI()}catch(e){alert(e.message)}}
async function payroll(){const mo=$("mo").value,s=await db.collection("attendance").where("cid","==",CID).where("sup","==",U.id).get(),G={};
 s.docs.map(d=>d.data()).filter(a=>a.date.startsWith(mo)&&a.out&&a.ap=="ok").forEach(a=>{const c=calc(a.w,a.hrs,a.otSt=="ok"),g=G[a.uid]||(G[a.uid]={n:a.name,d:0,h:0,o:0,g:0,pf:0,es:0,net:0});g.d++;g.h+=a.hrs;g.o+=c.o;g.g+=c.g;g.pf+=c.pf;g.es+=c.es;g.net+=c.net});
 const R=Object.values(G);window._csv="Name,Days,Hours,OT,Gross,EPF,ESIC,Net\n"+R.map(g=>[g.n,g.d,g.h.toFixed(1),g.o.toFixed(1),g.g,g.pf,g.es,g.net].join(",")).join("\n");
 $("pr").innerHTML=`<div class="sc"><table><tr><th>નામ</th><th>દિવસ</th><th>કલાક</th><th>OT</th><th>કુલ</th><th>EPF</th><th>ESIC</th><th>ચોખ્ખું</th></tr>${R.map(g=>`<tr><td>${g.n}</td><td>${g.d}</td><td>${g.h.toFixed(1)}</td><td>${g.o.toFixed(1)}</td><td>${g.g}</td><td>${g.pf}</td><td>${g.es}</td><td><b>${g.net}</b></td></tr>`).join("")}</table></div><button class="a" onclick="dl()">⬇ Excel (CSV) ડાઉનલોડ</button>`}
function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+window._csv],{type:"text/csv"}));a.download="payroll.csv";a.click()}
</script></body></html>
